# Massivora system configuration (YAML)
# Put machine/cluster specific settings here.
# This file supports comments.

system:
  # Default process count for download on login node
  download_processes: 4

batch:
  # Modules and environment setup injected into sbatch scripts
  script_dir: jobs
  modules:
    - anaconda/3/2023.03
    # - cuda/13.2-nvhpcsdk_26
  maximum_nodes: 16
  time_limit: "24:00:00"
  cpu_count: 128

  # Extra #SBATCH directives
  # The leading "#SBATCH " is added automatically.
  sbatch_directives:
    # - "--gres=gpu:4"
    # - "--partition=gpu"
    # - "--constraint=a100"
