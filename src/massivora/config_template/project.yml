# Massivora project configuration (YAML)
# This file supports comments.
# This is a template file, tailor it to your needs.

project:
  # Name of the project
  name: PROJECTNAME

  # Root folder for this project (data, outputs, jobs, db, ...)
  project_path: /PROJECTPATH/PROJECTNAME

  # Text file of protein list. One protein ID per line.
  proteins_list: /PROJECTPATH/PROJECTNAME/data/proteins.txt

# These are subdirectories under project_path
paths:
  # Where protein homologue MSAs are stored
  monomers: msa

  # Where concatenated alignments / EC outputs go
  couplings: ecs

# Database configuration
database:
  # Backend type: sqlite, mysql, mariadb, postgresql
  backend: sqlite

  # SQLite-specific (when backend=sqlite)
  filename: job_db.sqlite3

  # IMPORTANT for SLURM/HPC clusters: Set to true if database is on shared/network filesystem
  # (NFS, Lustre, GPFS, BeeGFS, etc.). This enables safe multi-node access.
  # If not specified, will auto-detect filesystem type.
  # shared_filesystem: true

  # MySQL/MariaDB/PostgreSQL-specific (when backend=mysql/mariadb/postgresql)
  # host: localhost
  # port: 3306  # 3306 for MySQL/MariaDB, 5432 for PostgreSQL
  # user: username
  # password: password
  # database: massivora
  #
  # Optional connection parameters
  # connect_timeout: 60
  # charset: utf8mb4  # MySQL/MariaDB only

logging:
  enabled: true
  level: INFO
  dir: /PROJECTPATH/PROJECTNAME/logs
  file: massivora.log


align: 
  db_table: alignments
  # jackhmmer and database
  jackhmmer_binary: /u/USER/apps/hmmer/bin/jackhmmer
  database: /u/USER/uniprot.fasta
  per_job_cpu: 4
  iterations: 5
  analogue_threshold: 0.2
  paralogue_threshold: 0.9
  row_gap_threshold: 0.5
  col_gap_threshold: 0.5
  keep_original_msa: false
  claim_batch_size: auto  # 'auto' or integer

  # Applies when one wants to split the calculation to multiple clusters
  # portion: 1.0
  # portion_start: 0.0

concatenate:
  db_table: couplings
  # method for pairing sequences in concatenated alignment
  method: best_hit
  # when a pair is shared-source, what to do:
  #   skip: log the pair and mark it FAILED (default)
  #   fix:  remove those species and go on with the rest
  shared-source_strategy: skip
  # The check uses each monomer's residue runs (run tables), computed once
  # per protein and saved so that every process and run maps the same copy.
  # Each saved table carries a fingerprint of the monomer it was built from
  # (shape, species, a sample of rows and the files of its zarr 'align'
  # array) and is rebuilt when the monomer's store is written again. Where
  # they are kept:
  #   auto:    <project_path>/shared_source_cache (default); the monomer
  #            tree is never written
  #   off:     in memory only, per process (every process builds the tables
  #            of the monomers it meets: about 0.3 s per pair)
  #   monomer: next to each monomer (<monomer>/shared_source_k10/); only for
  #            an MSA tree this project owns and may write
  #   a directory (relative to the project path): keep them there, one
  #            subdirectory per monomer. Mapping the tables is cheap on tmpfs
  #            (/dev/shm) and ext4/xfs, but not on ZFS or BeeGFS: there point
  #            this at /dev/shm/<something> (about 3x the monomers' size in
  #            RAM: 47 GB for the 1,554 H. pylori proteins)
  # A location that cannot be written is logged once (WARNING) and the
  # tables are then built in memory, as with 'off'.
  shared-source_cache: auto
  reweighting:
    enabled: true
    threshold: 0.8
  # downsample settings (optional)
  downsample:
    enabled: true
    to: 30000
  claim_batch_size: auto  # 'auto' or integer

couple:
  db_table: couplings
  claim_batch_size: auto  # 'auto' or integer
  memory_limit: 0.9
  # Finished pair's CN score matrix
  keep_coupling_matrix: false
  coupling_matrix_keep_option: all  # 'all' or 'top'

  method: plm

  # plmDCA parameters
  lambda_h: 0.01
  lambda_J: 0.01
  eps_conv: 3e-4   # CPU path: NLopt f/x tolerance
  eps_g: 1e-3      # GPU path: stop a site on max |gradient| <= eps_g
  maxit: 200
  fp16_history: false  # GPU path: L-BFGS history in fp16 (approximation, 1.12x)
  # Screen profile (plmDCA after a cascade): fp16_history: true and maxit: 50,
  # with no B cap below the default 30,000 (1.42x; on the labelled he2021 set
  # 0 to +1 detector hits vs production; a 10k or 5k cap compresses deep true
  # hits and is not recommended).
  fast_approximation: false
  site_batch: 24  # GPU: sites optimised in lockstep per pair (an upper bound)

  # GaussDCA parameters
  pseudocount: 0.8
  gauss_threads: auto  # 'auto' or integer
  gpu_sessions: 4  # concurrent pairs per GPU (plmDCA always runs one)

  # GPU executors, both methods
  gpu_memory_limit: 0.9  # share of each GPU's free memory the pairs in flight may hold
  gpu_host_processes: auto  # processes loading alignments and analysing scores; 'auto' or integer (0: in the coordinator)
  gpu_workers: 16  # pairs in flight; at least gpu_sessions x GPUs + gpu_host_processes

  # Fused screen mode: skip the concatenate stage; the coupling stage then
  # concatenates each pair in its host processes (gpu_host_processes) and, with
  # keep_concatenated: false, couples it from memory without writing its zarr.
  keep_concatenated: true

  # Cascade: couple only the best pairs of a finished GaussDCA run; the rest
  # are marked SKIPPED. Pairs the GaussDCA run did not finish are still
  # coupled, unless skip_unranked is set; pairs the GaussDCA run SKIPPED
  # itself (its pre-gate, below) are never coupled.
  # Option A (proteome screens; with maxit 50 and fp16_history true above):
  #   cascade: {source_db: gauss.sqlite3, keep_fraction: 0.20, min_neffoverL: 0.1}
  # keep_fraction (or keep_count) is the top-k threshold of the hand-off.
  # cascade:
  #   source_db: gauss.sqlite3  # DB of the GaussDCA run (default: this project's DB)
  #   source_table: couplings   # its couplings table (default: couple.db_table)
  #   keep_fraction: 0.20       # share of the ranked GaussDCA pairs to couple, or
  #   keep_count: null          # number of them; at most one of the two (neither:
  #                             # every ranked pair, the block only gates / skips)
  #   keep_denominator: ranked  # keep_fraction of: ranked (DONE source rows, the
  #                             # default) or ranked_plus_skipped (DONE + SKIPPED)
  #   rank_by: log_lr_raw       # or high_precision_hit (detector hits first)
  #   min_neffoverL: null       # depth gate (see below)
  #   skip_unranked: false      # also skip pairs the GaussDCA run never finished
  #
  # keep_fraction / keep_count: the ranked pairs are the source rows with
  # status DONE, ordered by rank_by. keep_fraction keeps the top share of them
  # (ceil), keep_count the top number; a block with neither keeps them all,
  # so a block that only gates is `cascade: {source_db: ..., min_neffoverL: 0.1}`.
  # keep_denominator: ranked_plus_skipped makes keep_fraction a share of the
  # ranked rows plus the rows the source left SKIPPED, i.e. the same number of
  # pairs as if the source had scored everything. It keeps a BUDGET, not a
  # SET: see configuration B below before using it.
  #
  # min_neffoverL: kept pairs whose GaussDCA row has neffoverL (Beff / L of
  # the concatenated alignment) below it are SKIPPED too. null (default) keeps
  # today's behaviour. A source row with NULL neffoverL, or a source table
  # without the column, is NOT gated; both are logged at WARNING, because a
  # gate that gates nothing costs 2-3x the GPU time it was set to save.
  # Below Beff / L = 0.1 the plmDCA detector is an artefact of the shallow
  # alignment: on labelled he2021 negatives subsampled to that depth it fires
  # on 6.0-6.7 % (its design FPR is 0.1 %), on labelled positives on 3 %
  # (37 of 38 true hits vanish), and log_lr_raw ranks at chance (AUC 0.56-0.57);
  # in situ it calls 12.7 % of random screen pairs below the gate against
  # 0.52 % above it, at a PPI prior of ~1e-3. On the H. pylori screen 72 % of
  # the top-16 % pairs sit there and take 61 % of the plmDCA hours.
  # keep_fraction 0.20 with min_neffoverL 0.1 shows no detectable loss of
  # labelled benchmark recall against the ungated top 16 % (plm top-5 %
  # positives 91 -> 91 %, detector hits 84 -> 86 %; CIs admit up to ~10 points,
  # and the benchmark holds only 13 of 4,545 pairs below the gate) at 1.6x less
  # plmDCA time. The threshold is bracketed by the labelled bands to
  # [0.05, 0.34]; 0.1 is the low end, i.e. the conservative choice.
  # State the gate in Methods; apply the same criterion to reported GaussDCA
  # calls.
  #
  # The same key in the GaussDCA stage's own config, without a source
  # (`cascade: {min_neffoverL: 0.1}`), is the GaussDCA PRE-GATE: after the
  # reweighting, a pair with Beff / L below it is not scored at all and is
  # stored SKIPPED with its depth and no score (apply_cascade then has nothing
  # to rank and does nothing). On the H. pylori screen that is 24 % of the
  # pairs and 77 % of today's GaussDCA detector hits (the shallow stratum of
  # the finding above); its accuracy cost is not measured on labels, since
  # the benchmark has no pairs at that depth.
  #
  # The two H. pylori screen configurations (1,206,653 scored pairs):
  #  A, headline -- GaussDCA on every pair, then for plmDCA
  #     cascade: {source_db: gauss.sqlite3, keep_fraction: 0.20, min_neffoverL: 0.1}
  #     = top 20 % by log_lr_raw (241,331 pairs), of which 77,225 have
  #     Neff / L >= 0.1: the gated set.
  #  B, pre-gate -- GaussDCA stage: cascade: {min_neffoverL: 0.1}; plmDCA stage:
  #     cascade: {source_db: gauss.sqlite3, keep_count: 77225, min_neffoverL: 0.1}
  #     selects exactly A's 77,225 pairs (verified on the screen DB: the gated
  #     set is the ungated pairs above one score threshold, and the pre-gate
  #     removes only ungated-below pairs). keep_fraction 0.20 would cut the
  #     shrunken ranked set (917,537 DONE) at 183,508 pairs (2.4x A), and
  #     keep_fraction 0.20 with keep_denominator ranked_plus_skipped keeps
  #     241,331 pairs, all above the gate (3.1x A): a larger set, not A. Under
  #     a pre-gate state the plmDCA cut as keep_count.
  #
  # skip_unranked: pairs the GaussDCA run never finished (FAILED; RUNNING rows
  # are never skipped) are unranked, so by default they stay claimable at full
  # cost. true marks them SKIPPED. This is a coverage decision, not a depth
  # gate: on the H. pylori screen those 12,457 rows have median B 7,129, i.e.
  # they are the deep pairs the gate exists to protect, and their hit loss is
  # unmeasured. Prefer finishing the source run. Pairs the GaussDCA run
  # SKIPPED (pre-gate or its own cascade) are a decision, not an unfinished
  # result: they are never coupled, whatever skip_unranked says.
  #
  # adaptive: a self-consistent hand-off threshold instead of keep_fraction /
  # keep_count (setting both is an error). The plmDCA run releases gated
  # GaussDCA pairs itself and learns from their results where to stop.
  #   cascade: {source_db: gauss.sqlite3, min_neffoverL: 0.1,
  #             adaptive: {model: costaware}}
  # model: costaware (screens; with the default cut_multiplier 1.8 it costs
  # about as much as the batch mode there, for higher hit recall): stratified
  # random convergence batches, a score s = P(top-5 % plmDCA call | GaussDCA rank, N, B, Neff/L) /
  # expected GPU seconds, and a threshold t (share of the gated pairs with
  # s >= s*) re-estimated after every check_every finished pairs; frozen once t
  # changes by < freeze_rel_change on freeze_consecutive consecutive checks,
  # then plmDCA runs on the cut_multiplier x t x n highest-s pairs, highest s
  # first (cut_multiplier 1: every pair with s >= s*). With cut_multiplier 1,
  # simulated on the H. pylori screen (917,537 gated pairs; 3,903 measured truth
  # rows imputed): ~49 measured plmDCA-h (56 h under iid imputation; cost-model
  # hours x ~1.21) against ~108 h for the batch mode, freeze after ~1,650 pairs
  # -- provided the GaussDCA tail (rank >= 0.4) holds almost no top calls, as in
  # the truth sample; 3-6 % of the top calls there would cost +8 to +38 h. Top-call recall
  # >= 0.95 holds in about 95-98 % of runs, not always (cut_multiplier 1.8:
  # ~116 measured h on the screen; see cut_multiplier below). The log's found /
  # total_hat is NOT a run's recall (uncorrelated with it in simulation).
  # Below min_population gated pairs the convergence batches eat much of the set
  # and the finalist meets both recalls in only 92-96 % of runs for at most
  # ~5 h of savings: small_population_mode base runs the batch mode instead
  # (top_fraction hits, target_recall), full runs every gated pair. The
  # hit-structure guard switches a run to the batch mode when the convergence
  # pairs show many more detector hits per top call than the screen (dense,
  # spread-out hits, e.g. a labelled benchmark set). A run refuses to continue
  # when the gated GaussDCA population or a rule key changed since it started.
  # Keys (defaults):
  #   adaptive:
  #     model: costaware
  #     start_fraction: 0.5       # t before the first estimate (t_0 of the rule)
  #     check_every: 50           # finished pairs per estimate (= batch size)
  #     freeze_rel_change: 0.01
  #     freeze_consecutive: 3
  #     z: 1.0                    # UCB of the missed top calls (mean + z sd)
  #     target_recall: 0.95
  #     top_fraction: 0.05        # top calls = plmDCA log_lr_raw in the top 5 %
  #     strata: 20                # GaussDCA-rank strata of the random batches
  #     tilt: 3.0                 # their weight for strata above rank tilt_above
  #     tilt_above: 0.4
  #     ridge: 1.0
  #     min_population: 50000     # gated pairs; below: small_population_mode
  #     small_population_mode: base   # or full
  #     guard_hits_per_top: 0.3   # HT detector hits per top call (screen <= 0.26; 0: off)
  #     guard_min_obs: 500        # results before the guard is checked
  #     cut_multiplier: 1.8       # run cut_multiplier x t x n pairs (>= 1). t alone meets
  #                               # the top-call target but missed detector hits on the real 403-protein
  #                               # sub-interactome (top 0.96, hits 0.82); 1.8 met both
  #                               # >= 0.95 in 198/200 replays at ~2x the plmDCA hours
  #                               # (screen simulation: ~116 h vs 49 h; batch mode 108 h)
  #     seed: 0
  #     lead: null                # claimable convergence pairs kept released (null: check_every)
  #     release_block: 1000       # claimable pairs kept released after the freeze
  #     running_timeout: 3600     # s; older claims of released pairs are handed back.
  #                               # Keep it above the longest claim-to-result time
  #                               # (claim depth x seconds per pair): a live claim
  #                               # handed back may run twice (e2e at 600 s: 3 live
  #                               # claims handed back, 4 pairs scored twice)
  # A worker with nothing left to claim logs whether the selection is complete
  # or released pairs are still claimed (by others, or by a dead worker: those
  # are handed back after running_timeout, so start a worker again later).
  # State: cascade_adaptive, cascade_adaptive_obs, cascade_adaptive_log in the
  # plmDCA DB (one log row per estimate). model: batch (default) is the batch
  # loop: start_fraction, target_recall, explore_fraction, batch | batch_fraction,
  # hit (detector | top_fraction), top_fraction, stable_batches, order, seed.
  #
  # claim_timeout: null  # s; claims older than this are handed back at start
  #                      # and when a claim comes back empty (a job killed past
  #                      # its SIGTERM grace leaves its pairs RUNNING)

  # Applies when one wants to split the calculation to multiple clusters
  # portion: 1.0
  # portion_start: 0.0

